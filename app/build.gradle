plugins { id 'com.android.application' }

android {
    namespace 'org.flightgear.android'
    compileSdk 36

    defaultConfig {
        applicationId 'org.flightgear.android'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt') }
    }
}
