name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main, native-flightgear-port ]

permissions:
  contents: read

concurrency:
  group: android-arm64-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Verify pinned Android toolchain
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.16248370"
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"

          test -d "$ANDROID_HOME/platforms/android-36"
          test -f "$ANDROID_HOME/build-tools/36.0.0/package.xml"
          test -f "$NDK/source.properties"
          grep -Fq "Pkg.Revision = 30.0.16248370" "$NDK/source.properties"
          test -x "$CMAKE"
          test -x "$CLANG"

          java -version
          gradle --version
          "$CMAKE" --version
          "$CLANG" --version
          "$ANDROID_HOME/build-tools/36.0.0/aapt" version

      - name: Validate Android Gradle configuration
        run: gradle --no-daemon :app:help

      - name: Prepare original FlightGear sources
        run: |
          chmod +x scripts/fetch-flightgear.sh scripts/build-curl-android.sh
          ./scripts/fetch-flightgear.sh

      - name: Build Android ARM64 libcurl
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370"
          scripts/build-curl-android.sh

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify FlightGear engine is linked
        run: |
          chmod +x scripts/test-native-engine-symbol.sh
          scripts/test-native-engine-symbol.sh app/build/intermediates/stripped_native_libs/debug/out/lib/arm64-v8a/libflightgear_android.so

      - name: Verify 16 KB native library alignment
        run: |
          chmod +x scripts/test-16kb-page-size.sh
          scripts/test-16kb-page-size.sh app/build/intermediates/stripped_native_libs/debug/out/lib/arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FlightGear-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
