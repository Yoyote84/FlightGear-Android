name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main, native-flightgear-port, native-flightgear-port-simgear-core ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          mkdir -p third_party
          cp -a /usr/include/boost third_party/boost

      - name: Prepare original FlightGear sources
        run: |
          chmod +x scripts/fetch-flightgear.sh
          ./scripts/fetch-flightgear.sh

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlightGear-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
