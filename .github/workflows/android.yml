name: FlightGear Android staged pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - native-flightgear-port
      - native-flightgear-port-simgear-core
      - native-flightgear-port-gate15-osgga
      - native-flightgear-port-gate16-osgtext
      - native-flightgear-port-gate17-osgviewer
      - native-flightgear-port-gate18-osg-renderer

jobs:
  osg:
    uses: ./.github/workflows/gate-osg.yml

  simgear:
    needs: osg
    uses: ./.github/workflows/gate-simgear.yml

  flightgear:
    needs: simgear
    uses: ./.github/workflows/gate-flightgear.yml

  final-apk:
    needs: flightgear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore upstream sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: fg-sources-${{ github.sha }}
      - name: Restore validated native state
        uses: actions/cache@v4
        with:
          path: app/.cxx
          key: fg-native-flightgear-${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble complete debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlightGear-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
