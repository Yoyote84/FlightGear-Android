name: Android ARM64 build

on:
  workflow_dispatch:
  push:
    branches: [ main, native-flightgear-port, native-flightgear-port-simgear-core ]

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Install native build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev libcjson-dev
          rm -rf third_party/boost
          mkdir -p third_party
          cp -a /usr/include/boost third_party/boost
          cp /usr/include/cjson/cJSON.h third_party/cJSON.h
          test -f third_party/boost/functional/hash.hpp
          test -f third_party/boost/call_traits.hpp
          test -f third_party/boost/bimap.hpp
          test -f third_party/cJSON.h

      - name: Prepare original FlightGear sources
        run: |
          chmod +x scripts/fetch-flightgear.sh
          ./scripts/fetch-flightgear.sh
          mkdir -p third_party/simgear/simgear
          cat > third_party/simgear/simgear/version.h <<'EOF'
          #pragma once
          #define SIMGEAR_VERSION 2024.2.0
          #define SIMGEAR_MAJOR_VERSION 2024
          #define SIMGEAR_MINOR_VERSION 2
          #define SIMGEAR_PATCH_VERSION 0
          EOF
          chmod +x scripts/patch-flightgear-android.sh
          ./scripts/patch-flightgear-android.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/CMakeLists.txt')
          s = p.read_text()
          needle = 'target_include_directories(simgear_scene_objects PRIVATE "${SIMGEAR_GENERATED_DIR}" "${SIMGEAR_ROOT}" "${SIMGEAR_ROOT}/simgear" "${FGOSG_ROOT}/include")'
          replacement = 'target_include_directories(simgear_scene_objects PRIVATE "${SIMGEAR_GENERATED_DIR}" "${SIMGEAR_ROOT}" "${SIMGEAR_ROOT}/simgear" "${SIMGEAR_ROOT}/simgear/canvas/ShaderVG/include" "${FGOSG_ROOT}/include")'
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('expected SimGear scene include path not found')
              s = s.replace(needle, replacement, 1)
          p.write_text(s)
          PY

      - name: Validate LLM Council adapter
        run: python3 tools/llm-council/council.py --self-test

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee build.log

      - name: Run LLM Council diagnostics after build failure
        if: failure()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COUNCIL_MODELS: openai/gpt-5.1,google/gemini-3-pro-preview,anthropic/claude-sonnet-4.5
          COUNCIL_CHAIRMAN_MODEL: google/gemini-3-pro-preview
        run: |
          python3 tools/llm-council/council.py --log build.log --output llm-council-report.md

      - name: Upload LLM Council report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FlightGear-Android-llm-council-report
          path: llm-council-report.md
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FlightGear-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
